name: Apply runtime hardening

on:
  push:
    branches:
      - agent/harden-steward-runtime

permissions:
  contents: write

concurrency:
  group: apply-runtime-hardening
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-steward-runtime
          fetch-depth: 0

      - name: Patch the WASM executor
        run: python .github/scripts/apply_runtime_hardening.py

      - name: Commit patched executor
        shell: bash
        run: |
          if git diff --quiet -- crates/daemon/src/tool_executors.rs; then
            echo "No executor changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/tool_executors.rs
          git commit -m "refactor: route wasm.run through bounded sandbox [runtime-hardening-applied]"
          git push origin HEAD:agent/harden-steward-runtime
