[package]
name = "steward-desktop"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
steward-core = { workspace = true }
tauri = { version = "2.11.5", features = ["wry", "common-controls-v6", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"

[lib]
name = "steward_desktop"
path = "src/lib.rs"

[[bin]]
name = "steward-desktop"
path = "src/main.rs"
tokio = { workspace = true, features = ["process", "time", "rt", "macros"] }

[dev-dependencies]

[build-dependencies]
tauri-build = { version = "2", features = [] }
