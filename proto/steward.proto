syntax = "proto3";
package steward;

service StewardService {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc RunPlugin (RunPluginRequest) returns (RunPluginResponse);
  rpc ExecuteTask (ExecuteTaskRequest) returns (ExecuteTaskResponse);
  rpc Chat (ChatRequest) returns (stream ChatEvent);
  rpc ListProviderCatalog (ListProviderCatalogRequest) returns (ListProviderCatalogResponse);
  rpc ListProviderProfiles (ListProviderProfilesRequest) returns (ListProviderProfilesResponse);
  rpc SaveProviderProfile (SaveProviderProfileRequest) returns (ProviderProfileInfo);
  rpc ActivateProviderProfile (ActivateProviderProfileRequest) returns (ProviderProfileInfo);
  rpc DeleteProviderProfile (DeleteProviderProfileRequest) returns (DeleteProviderProfileResponse);
  rpc ListProviderModels (ListProviderModelsRequest) returns (ListProviderModelsResponse);
  rpc ListChatSessions (ListChatSessionsRequest) returns (ListChatSessionsResponse);
  rpc GetChatSession (GetChatSessionRequest) returns (ChatSession);
  rpc DeleteChatSession (DeleteChatSessionRequest) returns (DeleteChatSessionResponse);
  rpc StoreMemory (StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc RecallMemory (RecallMemoryRequest) returns (RecallMemoryResponse);
  rpc GraphQuery (GraphQueryRequest) returns (GraphQueryResponse);
  rpc GetKnowledgeGraph (GetKnowledgeGraphRequest) returns (GetKnowledgeGraphResponse);
  rpc StartWorkflow (StartWorkflowRequest) returns (stream WorkflowEvent);
  rpc SaveWorkflowDefinition (SaveWorkflowDefinitionRequest) returns (WorkflowDefinition);
  rpc ListWorkflowDefinitions (ListWorkflowDefinitionsRequest) returns (ListWorkflowDefinitionsResponse);
  rpc DeleteWorkflowDefinition (DeleteWorkflowDefinitionRequest) returns (DeleteWorkflowDefinitionResponse);
  rpc GetWorkflowStatus (GetWorkflowStatusRequest) returns (WorkflowStatus);
  rpc ListWorkflows (ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc CancelWorkflow (CancelWorkflowRequest) returns (CancelWorkflowResponse);
  rpc ApprovePlan (ApprovePlanRequest) returns (ApprovePlanResponse);
  rpc ListAgents (ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgentLog (GetAgentLogRequest) returns (stream AgentLogEntry);
  rpc ListTools (ListToolsRequest) returns (ListToolsResponse);
  rpc SetToolEnabled (SetToolEnabledRequest) returns (ToolInfo);
  rpc ListSkills (ListSkillsRequest) returns (ListSkillsResponse);
  rpc InstallSkill (InstallSkillRequest) returns (InstallSkillResponse);
  rpc InvokeTool (InvokeToolRequest) returns (InvokeToolResponse);
  rpc ListToolInvocations (ListToolInvocationsRequest) returns (ListToolInvocationsResponse);
  rpc RegisterMcpAdapter (RegisterMcpAdapterRequest) returns (McpAdapterInfo);
  rpc ListMcpAdapters (ListMcpAdaptersRequest) returns (ListMcpAdaptersResponse);
  rpc StartMcpAdapter (McpAdapterActionRequest) returns (McpAdapterInfo);
  rpc StopMcpAdapter (McpAdapterActionRequest) returns (McpAdapterInfo);
  rpc RemoveMcpAdapter (McpAdapterActionRequest) returns (RemoveMcpAdapterResponse);
  rpc GetMaintenanceStatus (MaintenanceRequest) returns (MaintenanceStatus);
  rpc PruneNow (MaintenanceRequest) returns (PruneResponse);
  rpc GetSecuritySettings (GetSecuritySettingsRequest) returns (SecuritySettingsInfo);
  rpc SaveSecuritySettings (SecuritySettingsInfo) returns (SecuritySettingsInfo);
  rpc ListCronJobs (ListCronJobsRequest) returns (ListCronJobsResponse);
  rpc CreateCronJob (CreateCronJobRequest) returns (CronJobInfo);
  rpc SetCronJobEnabled (SetCronJobEnabledRequest) returns (CronJobInfo);
  rpc DeleteCronJob (DeleteCronJobRequest) returns (DeleteCronJobResponse);
  rpc RunCronJobNow (RunCronJobNowRequest) returns (CronJobInfo);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}

message RunPluginRequest {
  bytes wasm_binary = 1;
}
message RunPluginResponse {
  string output = 1;
}

enum ToolRuntimeKind {
  TOOL_RUNTIME_KIND_UNSPECIFIED = 0;
  TOOL_RUNTIME_KIND_BUILTIN = 1;
  TOOL_RUNTIME_KIND_WASM = 2;
  TOOL_RUNTIME_KIND_PROCESS = 3;
  TOOL_RUNTIME_KIND_MCP = 4;
}

enum ToolRiskLevel {
  TOOL_RISK_LEVEL_UNSPECIFIED = 0;
  TOOL_RISK_LEVEL_LOW = 1;
  TOOL_RISK_LEVEL_MEDIUM = 2;
  TOOL_RISK_LEVEL_HIGH = 3;
}

message ToolInfo {
  string tool_id = 1;
  string name = 2;
  string description = 3;
  ToolRuntimeKind runtime = 4;
  ToolRiskLevel risk = 5;
  bool enabled = 6;
  bool requires_approval = 7;
}

message SkillInfo {
  string skill_id = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  bool enabled = 5;
  repeated string tool_ids = 6;
  bool signed = 7;
  string publisher_key = 8;
  string manifest_digest = 9;
  double installed_at = 10;
}

message ListToolsRequest {
  bool include_disabled = 1;
}
message ListToolsResponse {
  repeated ToolInfo tools = 1;
}

message SetToolEnabledRequest {
  string tool_id = 1;
  bool enabled = 2;
}

message ListSkillsRequest {
  bool include_disabled = 1;
}
message ListSkillsResponse {
  repeated SkillInfo skills = 1;
}

message InstallSkillRequest {
  bytes bundle = 1;
}
message InstallSkillResponse {
  SkillInfo skill = 1;
}

message InvokeToolRequest {
  string tool_id = 1;
  map<string, string> arguments = 2;
  bool approved = 3;
  string working_directory = 4;
}
message InvokeToolResponse {
  string invocation_id = 1;
  string status = 2;
  string output = 3;
  string message = 4;
  bool requires_approval = 5;
}

message ToolInvocationInfo {
  string invocation_id = 1;
  string tool_id = 2;
  bool approved = 3;
  string input_json = 4;
  string status = 5;
  string output = 6;
  string error = 7;
  double created_at = 8;
}

message ListToolInvocationsRequest {
  int32 limit = 1;
}
message ListToolInvocationsResponse {
  repeated ToolInvocationInfo invocations = 1;
}

message McpAdapterInfo {
  string adapter_id = 1;
  string name = 2;
  string command = 3;
  repeated string arguments = 4;
  string cwd = 5;
  string status = 6;
  string server_name = 7;
  string server_version = 8;
  int32 tool_count = 9;
  string error = 10;
}

message RegisterMcpAdapterRequest {
  string adapter_id = 1;
  string name = 2;
  string command = 3;
  repeated string arguments = 4;
  string cwd = 5;
}
message ListMcpAdaptersRequest {}
message ListMcpAdaptersResponse {
  repeated McpAdapterInfo adapters = 1;
}
message McpAdapterActionRequest {
  string adapter_id = 1;
}
message RemoveMcpAdapterResponse {
  bool removed = 1;
}

message GetSecuritySettingsRequest {}
message SecuritySettingsInfo {
  repeated string process_exec_allowlist = 1;
}

message CronJobInfo {
  string job_id = 1;
  string name = 2;
  string tool_id = 3;
  string input_json = 4;
  int64 interval_seconds = 5;
  bool enabled = 6;
  double last_run_at = 7;
  string last_status = 8;
  double created_at = 9;
}

message ListCronJobsRequest {}
message ListCronJobsResponse {
  repeated CronJobInfo jobs = 1;
}

message CreateCronJobRequest {
  string name = 1;
  string tool_id = 2;
  string input_json = 3;
  int64 interval_seconds = 4;
}

message SetCronJobEnabledRequest {
  string job_id = 1;
  bool enabled = 2;
}

message DeleteCronJobRequest {
  string job_id = 1;
}
message DeleteCronJobResponse {
  bool deleted = 1;
}

message RunCronJobNowRequest {
  string job_id = 1;
}

message MaintenanceRequest {}
message MaintenanceStatus {
  int32 retention_days = 1;
  int32 max_completed_workflows = 2;
}
message PruneResponse {
  int64 tool_invocations = 1;
  int64 workflows = 2;
}

message ExecuteTaskRequest {
  string task = 1;
}
message ExecuteTaskResponse {
  string status = 1;
}

enum ProviderProtocol {
  PROVIDER_PROTOCOL_UNSPECIFIED = 0;
  PROVIDER_PROTOCOL_OPENAI_CHAT = 1;
  PROVIDER_PROTOCOL_ANTHROPIC_MESSAGES = 2;
  PROVIDER_PROTOCOL_GEMINI_GENERATE_CONTENT = 3;
}

message ProviderCatalogEntry {
  string provider_id = 1;
  string name = 2;
  ProviderProtocol protocol = 3;
  string default_base_url = 4;
  string default_api_key_env = 5;
}
message ListProviderCatalogRequest {}
message ListProviderCatalogResponse {
  repeated ProviderCatalogEntry providers = 1;
}

message ProviderProfileInfo {
  string profile_id = 1;
  string provider_id = 2;
  string display_name = 3;
  ProviderProtocol protocol = 4;
  string base_url = 5;
  string model = 6;
  string api_key_env = 7;
  bool active = 8;
}
message ListProviderProfilesRequest {}
message ListProviderProfilesResponse {
  repeated ProviderProfileInfo profiles = 1;
}
message SaveProviderProfileRequest {
  ProviderProfileInfo profile = 1;
  bool activate = 2;
}
message ActivateProviderProfileRequest {
  string profile_id = 1;
}
message DeleteProviderProfileRequest {
  string profile_id = 1;
}
message DeleteProviderProfileResponse {
  bool deleted = 1;
}

message ListProviderModelsRequest {
  ProviderProtocol protocol = 1;
  string base_url = 2;
  string api_key_env = 3;
}
message ListProviderModelsResponse {
  repeated string model_ids = 1;
  string error = 2;
}

message ChatRequest {
  string session_id = 1;
  string message = 2;
  string working_directory = 3;
  bool allow_tools = 4;
}
enum ChatEventKind {
  CHAT_EVENT_KIND_UNSPECIFIED = 0;
  CHAT_EVENT_KIND_SESSION = 1;
  CHAT_EVENT_KIND_TEXT = 2;
  CHAT_EVENT_KIND_TOOL_START = 3;
  CHAT_EVENT_KIND_TOOL_RESULT = 4;
  CHAT_EVENT_KIND_DONE = 5;
}
message ChatEvent {
  string event_id = 1;
  string session_id = 2;
  ChatEventKind kind = 3;
  string content = 4;
  string tool_name = 5;
  string tool_call_id = 6;
  string arguments_json = 7;
  bool is_error = 8;
  int64 prompt_tokens = 9;
  int64 completion_tokens = 10;
}

message ChatSessionSummary {
  string session_id = 1;
  string title = 2;
  string provider_profile = 3;
  string model = 4;
  double created_at = 5;
  double updated_at = 6;
}
message ChatMessageInfo {
  int64 message_id = 1;
  string role = 2;
  string content = 3;
  string tool_name = 4;
  string tool_call_id = 5;
  double created_at = 6;
}
message ChatSession {
  ChatSessionSummary summary = 1;
  repeated ChatMessageInfo messages = 2;
}
message ListChatSessionsRequest {
  int32 limit = 1;
}
message ListChatSessionsResponse {
  repeated ChatSessionSummary sessions = 1;
}
message GetChatSessionRequest {
  string session_id = 1;
}
message DeleteChatSessionRequest {
  string session_id = 1;
}
message DeleteChatSessionResponse {
  bool deleted = 1;
}

message MemoryEntry {
  string id = 1;
  int32 memory_type = 2;
  string content = 3;
  map<string, string> metadata = 4;
  repeated string entities = 5;
  double timestamp = 6;
  repeated float embedding = 7;
}

message StoreMemoryRequest {
  MemoryEntry entry = 1;
}
message StoreMemoryResponse {
  string id = 1;
  bool stored = 2;
}

message RecallMemoryRequest {
  string query = 1;
  int32 memory_type = 2;
  int32 limit = 3;
  repeated float query_embedding = 4;
}
message RecallMemoryResponse {
  repeated MemoryEntry entries = 1;
}

message GraphNode {
  string id = 1;
  string label = 2;
  string node_type = 3;
  map<string, string> properties = 4;
  repeated float embedding = 5;
}

message GraphEdge {
  string id = 1;
  string source_id = 2;
  string target_id = 3;
  string relationship = 4;
  map<string, string> properties = 5;
  double weight = 6;
}

message GraphQueryRequest {
  string query = 1;
  int32 max_hops = 2;
  int32 limit = 3;
}
message GraphQueryResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  string summary = 3;
}

message GetKnowledgeGraphRequest {
  string entity_filter = 1;
  int32 depth = 2;
  int32 limit = 3;
}
message GetKnowledgeGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

message ApprovalRequest {
  string title = 1;
  string description = 2;
  repeated string options = 3;
  string plan_summary = 4;
  int32 recommended_mode = 5;
}

message WorkflowEvent {
  string workflow_id = 1;
  int32 phase = 2;
  string agent_id = 3;
  string message = 4;
  string detail = 5;
  float progress = 6;
  bool requires_approval = 7;
  ApprovalRequest approval = 8;
}

message StartWorkflowRequest {
  string title = 1;
  string description = 2;
  string target_repo = 3;
  repeated string files = 4;
  map<string, string> constraints = 5;
  string definition_id = 6;
}

message WorkflowNode {
  string node_id = 1;
  string title = 2;
  string instruction = 3;
  string agent_id = 4;
  bool allow_tools = 5;
  int32 position_x = 6;
  int32 position_y = 7;
}

message WorkflowConnection {
  string source_node_id = 1;
  string target_node_id = 2;
}

message WorkflowDefinition {
  string definition_id = 1;
  string name = 2;
  string description = 3;
  repeated WorkflowNode nodes = 4;
  repeated WorkflowConnection connections = 5;
  double created_at = 6;
  double updated_at = 7;
}

message SaveWorkflowDefinitionRequest { WorkflowDefinition definition = 1; }
message ListWorkflowDefinitionsRequest {}
message ListWorkflowDefinitionsResponse { repeated WorkflowDefinition definitions = 1; }
message DeleteWorkflowDefinitionRequest { string definition_id = 1; }
message DeleteWorkflowDefinitionResponse { bool deleted = 1; }

message GetWorkflowStatusRequest {
  string workflow_id = 1;
}

message WorkflowStatus {
  string workflow_id = 1;
  string title = 2;
  int32 phase = 3;
  int32 mode = 4;
  float overall_progress = 5;
  string current_agent = 6;
  string status_message = 7;
  repeated WorkflowEvent recent_events = 8;
  bool requires_approval = 9;
  ApprovalRequest pending_approval = 10;
}

message ListWorkflowsRequest {
  int32 phase_filter = 1;
  int32 limit = 2;
}
message ListWorkflowsResponse {
  repeated WorkflowStatus workflows = 1;
}

message CancelWorkflowRequest {
  string workflow_id = 1;
  string reason = 2;
}
message CancelWorkflowResponse {
  bool cancelled = 1;
}

message ApprovePlanRequest {
  string workflow_id = 1;
  int32 mode = 2;
  bool approved = 3;
  string feedback = 4;
}
message ApprovePlanResponse {
  bool accepted = 1;
  string message = 2;
}

message AgentInfo {
  string agent_id = 1;
  string name = 2;
  string role = 3;
  string status = 4;
  string current_task = 5;
  float progress = 6;
}

message ListAgentsRequest {}
message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message GetAgentLogRequest {
  string workflow_id = 1;
  string agent_id = 2;
}
message AgentLogEntry {
  double timestamp = 1;
  string level = 2;
  string message = 3;
  string detail = 4;
}
