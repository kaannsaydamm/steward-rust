syntax = "proto3";
package steward;

service StewardService {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc RunPlugin (RunPluginRequest) returns (RunPluginResponse);
  rpc ExecuteTask (ExecuteTaskRequest) returns (ExecuteTaskResponse);
  rpc StoreMemory (StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc RecallMemory (RecallMemoryRequest) returns (RecallMemoryResponse);
  rpc GraphQuery (GraphQueryRequest) returns (GraphQueryResponse);
  rpc GetKnowledgeGraph (GetKnowledgeGraphRequest) returns (GetKnowledgeGraphResponse);
  rpc StartWorkflow (StartWorkflowRequest) returns (stream WorkflowEvent);
  rpc GetWorkflowStatus (GetWorkflowStatusRequest) returns (WorkflowStatus);
  rpc ListWorkflows (ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc CancelWorkflow (CancelWorkflowRequest) returns (CancelWorkflowResponse);
  rpc ApprovePlan (ApprovePlanRequest) returns (ApprovePlanResponse);
  rpc ListAgents (ListAgentsRequest) returns (ListAgentsResponse);
  rpc GetAgentLog (GetAgentLogRequest) returns (stream AgentLogEntry);
}

message PingRequest {}
message PingResponse {
  string status = 1;
}

message RunPluginRequest {
  bytes wasm_binary = 1;
}
message RunPluginResponse {
  string output = 1;
}

message ExecuteTaskRequest {
  string task = 1;
}
message ExecuteTaskResponse {
  string status = 1;
}

message MemoryEntry {
  string id = 1;
  int32 memory_type = 2;
  string content = 3;
  map<string, string> metadata = 4;
  repeated string entities = 5;
  double timestamp = 6;
  repeated float embedding = 7;
}

message StoreMemoryRequest {
  MemoryEntry entry = 1;
}
message StoreMemoryResponse {
  string id = 1;
  bool stored = 2;
}

message RecallMemoryRequest {
  string query = 1;
  int32 memory_type = 2;
  int32 limit = 3;
  repeated float query_embedding = 4;
}
message RecallMemoryResponse {
  repeated MemoryEntry entries = 1;
}

message GraphNode {
  string id = 1;
  string label = 2;
  string node_type = 3;
  map<string, string> properties = 4;
  repeated float embedding = 5;
}

message GraphEdge {
  string id = 1;
  string source_id = 2;
  string target_id = 3;
  string relationship = 4;
  map<string, string> properties = 5;
  double weight = 6;
}

message GraphQueryRequest {
  string query = 1;
  int32 max_hops = 2;
  int32 limit = 3;
}
message GraphQueryResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  string summary = 3;
}

message GetKnowledgeGraphRequest {
  string entity_filter = 1;
  int32 depth = 2;
  int32 limit = 3;
}
message GetKnowledgeGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

message ApprovalRequest {
  string title = 1;
  string description = 2;
  repeated string options = 3;
  string plan_summary = 4;
  int32 recommended_mode = 5;
}

message WorkflowEvent {
  string workflow_id = 1;
  int32 phase = 2;
  string agent_id = 3;
  string message = 4;
  string detail = 5;
  float progress = 6;
  bool requires_approval = 7;
  ApprovalRequest approval = 8;
}

message StartWorkflowRequest {
  string title = 1;
  string description = 2;
  string target_repo = 3;
  repeated string files = 4;
  map<string, string> constraints = 5;
}

message GetWorkflowStatusRequest {
  string workflow_id = 1;
}

message WorkflowStatus {
  string workflow_id = 1;
  string title = 2;
  int32 phase = 3;
  int32 mode = 4;
  float overall_progress = 5;
  string current_agent = 6;
  string status_message = 7;
  repeated WorkflowEvent recent_events = 8;
  bool requires_approval = 9;
  ApprovalRequest pending_approval = 10;
}

message ListWorkflowsRequest {
  int32 phase_filter = 1;
  int32 limit = 2;
}
message ListWorkflowsResponse {
  repeated WorkflowStatus workflows = 1;
}

message CancelWorkflowRequest {
  string workflow_id = 1;
  string reason = 2;
}
message CancelWorkflowResponse {
  bool cancelled = 1;
}

message ApprovePlanRequest {
  string workflow_id = 1;
  int32 mode = 2;
  bool approved = 3;
  string feedback = 4;
}
message ApprovePlanResponse {
  bool accepted = 1;
  string message = 2;
}

message AgentInfo {
  string agent_id = 1;
  string name = 2;
  string role = 3;
  string status = 4;
  string current_task = 5;
  float progress = 6;
}

message ListAgentsRequest {}
message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

message GetAgentLogRequest {
  string workflow_id = 1;
  string agent_id = 2;
}
message AgentLogEntry {
  double timestamp = 1;
  string level = 2;
  string message = 3;
  string detail = 4;
}
