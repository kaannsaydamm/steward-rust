name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-runtime-hardening:
    name: Apply runtime hardening patch
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/harden-steward-runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/harden-steward-runtime
          fetch-depth: 0

      - name: Patch the WASM executor
        run: python .github/scripts/apply_runtime_hardening.py

      - name: Commit patched executor
        shell: bash
        run: |
          if git diff --quiet -- crates/daemon/src/tool_executors.rs; then
            echo "No executor changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/daemon/src/tool_executors.rs
          git commit -m "refactor: route wasm.run through bounded sandbox [runtime-hardening-applied]"
          git push origin HEAD:agent/harden-steward-runtime

  verify:
    name: Verify (${{ matrix.os }})
    needs: apply-runtime-hardening
    if: ${{ always() && (needs.apply-runtime-hardening.result == 'success' || needs.apply-runtime-hardening.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Install Web UI dependencies
        working-directory: web-ui
        run: npm ci

      - name: Lint Web UI
        working-directory: web-ui
        run: npm run lint

      - name: Build Web UI
        working-directory: web-ui
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace -- --test-threads=1
