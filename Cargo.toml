[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/daemon",
    "crates/cli",
    "crates/knowledge",
    "tests",
    "crates/kernel",
    "crates/evals",
    "crates/context",
    "crates/models",
    "crates/tools",
    "crates/wire",
]

[workspace.package]
authors = ["Kaan Kadir Aluçlu"]
license = "MIT"
repository = "https://github.com/kaannsaydamm/steward"
homepage = "https://github.com/kaannsaydamm/steward"

[workspace.dependencies]
steward-core = { path = "crates/core" }
steward-knowledge = { path = "crates/knowledge" }
tokio = { version = "1.0", features = ["full"] }
tonic = "0.12"
tonic-build = "0.12"
tonic-web = "0.12"
prost = "0.13"
rusqlite = { version = "0.32", features = ["backup", "bundled", "load_extension"] }
sqlite-vec = "0.1"
wasmtime = "29.0.1"
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
log = "0.4"
env_logger = "0.11"
tempfile = "3.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
petgraph = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors", "fs"] }
axum = { version = "0.7", features = ["ws"] }
portable-pty = "0.8"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
sha2 = "0.10"
thiserror = "2"
parking_lot = "0.12"
url = "2"
keyring = "4"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
